<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{ page.title }} · Amigo Studios</title>
<style>
:root{--ink:#2b2420;--clay:#b5532f;--cream:#faf4ea;--line:#e6d9c6;--muted:#7a6a5c}
*{box-sizing:border-box}
body{background:#fff;color:var(--ink);font:16px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;margin:0}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
.kicker{color:var(--clay);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
h1{font-family:Georgia,serif;font-weight:normal;font-size:30px;line-height:1.2;margin:6px 0 16px}
h2{font-family:Georgia,serif;font-weight:normal;color:var(--clay);font-size:22px;margin:36px 0 10px;border-bottom:1px solid var(--line);padding-bottom:4px}
h3{font-size:17px;margin:24px 0 8px}
a{color:var(--clay)}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.tablewrap,table{display:block;overflow-x:auto}
table{border-collapse:collapse;margin:12px 0 18px;font-size:14.5px;background:var(--cream);width:100%}
th{background:var(--clay);color:#fff;font-weight:600;text-align:left;padding:7px 10px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.price{margin:18px 0;padding:14px 18px;border:2px dashed var(--clay);background:var(--cream);font-size:18px}
footer{color:var(--muted);font-size:13px;margin-top:40px}
li.task{list-style:none;margin-left:-1.2em}
.box{display:inline-block;width:1.4em;color:var(--clay);font-size:1.1em}
.box.done{color:#3c7a3c}
</style>
{% if page.url == '/' %}{% assign r = '' %}{% else %}{% assign r = '../' %}{% endif %}{% if page.fillable %}<link rel="stylesheet" href="{{ r }}assets/handoff.css?v=4">{% endif %}</head>
<body><main>
<div class="kicker">Amigo Studios · Oceanside · hand off</div>
{{ content }}
<footer>Edit this page on GitHub: <a href="https://github.com/amigostudios/amigo-handoff/edit/main/{{ page.path }}">{{ page.path }}</a></footer>
</main><script>
document.querySelectorAll('li').forEach(function(li){
  var n=li.firstChild; if(!n||n.nodeType!==3) return;
  var m=n.textContent.match(/^\s*\[( |x|X)\]\s*/); if(!m) return;
  n.textContent=n.textContent.slice(m[0].length);
  var b=document.createElement('span'); b.className='box'+(m[1]===' '?'':' done'); b.textContent=m[1]===' '?'☐':'☑';
  li.insertBefore(b,li.firstChild); li.classList.add('task');
});
</script>
{% if page.fillable %}<script src="{{ r }}assets/handoff.js?v=3"></script>{% endif %}
</body></html>
